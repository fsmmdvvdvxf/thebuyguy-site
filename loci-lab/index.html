 const cv=document.getElementById("surf");
 if(cv){
  const rows=Store.d.sessions.filter(s=>s.drill==="flash")
    .flatMap(s=>(s.rows||[])).filter(r=>r.load!=null&&r.exp!=null);
  if(rows.length)surface3d(cv,buildGrid(rows));
 }
 const imp=document.getElementById("pImport"), file=document.getElementById("pFile");
 if(imp&&file){
  imp.onclick=()=>{
    if(imp.dataset.armed&&PENDING_IMPORT){ importData(JSON.stringify(PENDING_IMPORT),imp); return; }
    file.click();
  };
  file.onchange=()=>{
   const f=file.files&&file.files[0]; if(!f)return;
   const r=new FileReader();
   r.onload=()=>importData(String(r.result||""),imp);
   r.onerror=()=>{imp.textContent="Could not read that file";};
   r.readAsText(f);
   file.value="";
  };
 }
 const ex=document.getElementById("pExport");
 if(ex)ex.onclick=async()=>{
  const data=JSON.stringify({exported:new Date().toISOString(),profile:Store.d.profile,
    sessions:Store.d.sessions,cards:Store.d.cards,sets:Store.d.sets,passages:Store.d.passages},null,2);
  ex.textContent="Preparing…";
  try{
   const name="loci-lab-"+today()+".json";
   const dl=await window.claude?.use?.("downloads");
   if(dl){ await dl.save({filename:name,data}); ex.textContent="Saved"; }
   else if(saveBlob(name,data)){ ex.textContent="Downloaded"; }
   else { await navigator.clipboard.writeText(data); ex.textContent="Copied to clipboard"; }
  }catch(e){ ex.textContent="Could not save — try again"; }
  setTimeout(()=>{if(ex.isConnected)ex.textContent="Export training data";},2600);
 };
}

/* ═══════════ screen: GUIDE ═══════════ */
function screenGuide(){
 const S=(t,b,o)=>section(ICON.guide,t,"",`<div class="prose">${b}</div>`,o);
 return `<div class="wrap"><div class="stack">
   ${header("The method","Guide","Why each drill is here, and what it is actually doing.")}
   ${S("The honest frame",`<p>Adult photographic memory is not supported by evidence. What the record does
    support is that the outcome is reachable another way.</p>
    <p>Chase and Ericsson's subject <b>SF</b> went from a 7-digit span to 82 over roughly 230 hours, by building
    running-time codes for digit groups. Maguire's 2003 imaging of World Memory Championship competitors found
    <b>no structural brain differences</b> from controls: the difference was strategy, recruiting spatial
    navigation circuitry for non-spatial material. Dresler and colleagues (2017, <i>Neuron</i>) trained ordinary
    people 30 minutes a day for six weeks on method of loci, roughly doubled recall, and the gain held at
    four months.</p>
    <p>So the ceiling is real. The route is skill acquisition, not unlocking a latent faculty.</p>`,true)}
   ${S("You cannot widen the aperture, only fill it",`<p>Visual working memory holds three or four integrated
    objects. No training regime has reliably moved that. What moves without limit is <b>what counts as one
    object</b>.</p>
    <p>Chase and Simon, 1973: chess masters shown a real position for five seconds reconstruct it almost
    perfectly; on randomly scattered pieces they are no better than novices. The advantage was never visual
    capacity. It was a library of stored patterns. A master does not see 25 pieces, they see four structures.</p>
    <p>That is what <b>Patterns</b> builds and what <b>Flash</b> measures. Expect a threshold effect around
    150 to 200 patterns in a domain, not gradual improvement.</p>`)}
   ${S("The signal-loss fix",`<p>An image that is clear and then degrades into static is visuospatial working
    memory decaying under executive load. Each computation step consumes the resource needed to refresh the
    stored image, so the picture starves rather than gets overwritten.</p>
    <ul>
     <li><b>Offload visual to spatial.</b> Store intermediates at fixed locations, not as a picture. Locations
     decay far more slowly. That is what the three slots in Mental Math are.</li>
     <li><b>Dual-code every intermediate.</b> Subvocalize each as you place it, so it lives in the phonological
     loop as well. Highest-yield single fix.</li>
     <li><b>Cut step count, not step difficulty.</b> Trachtenberg shortcuts, complements, squares to 100.</li>
     <li><b>Refresh on a cadence.</b> Every two or three steps re-touch every stored intermediate. The beat
     in Mental Math cues this.</li>
     <li><b>Train the sketchpad task-specifically.</b> Grid, mental rotation, blindfold chess. Not dual n-back,
     whose far-transfer evidence is weak.</li>
    </ul>`)}
   ${S("Moving an equation, externalised",`<p>Balancing an equation is a <i>procedure</i>, not a fact,
    and procedures get fast the same way motor skills do: by being run many times with immediate,
    accurate feedback. The trouble with running it silently is that a mental animation has no
    referee. A step that quietly went wrong feels exactly like one that went right.</p>
    <p>So the Balance drill plays your procedure outside your head, in four beats: the operation
    <b>drops</b> in under both sides, <b>pushes</b> up into the terms it touches, those terms
    <b>merge</b> into their new values, and the equation <b>settles</b>. Same four beats every time,
    which is what lets it become a template rather than a fresh act of reasoning.</p>
    <p><b>Head first</b> is where the training actually happens. You solve silently, commit to an
    answer, and only then watch the canonical route play. Committing before you see it is what makes
    the comparison informative \u2014 this is the testing effect, and a prediction you have already
    made is corrected far more strongly than one you never made.</p>
    <p>The app never counts a step as right merely because it is legal. Both sides always get the
    same operation, so every state is mathematically sound; what is scored is whether you reached
    <i>x</i> alone, and in how many steps against the shortest route.</p>`)}
   ${S("Verbatim text",`<p>Chunk into 3 to 7 word phrases at syntactic boundaries. One locus per chunk.
    Encode each as a single interacting image, not word by word. Say it aloud with distinct prosody as you
    place it. Impose rhythm the prose does not have.</p>
    <p>The four stages here are fading cues: the phrase, then first letters, then words dropped at 20, 50 and
    80 percent, then nothing. Precedent: Vedic <i>pāṭha</i> layered permutation recitation, and hafiz
    memorization of roughly 77,000 words by layered repetition with daily review.</p>`)}
   ${S("The daily block",`<ul>
     <li><b>5 min</b> warm-up, speed-drill the number system</li>
     <li><b>25 to 40 min</b> the current phase skill</li>
     <li><b>15 to 20 min</b> verbatim passage work</li>
     <li><b>10 to 15 min</b> pattern review, whatever is due</li>
     <li><b>10 min</b> workspace, mental math and grid</li>
    </ul>
    <p>Flash is fatiguing in a way that makes extra reps counterproductive. Twenty trials a day, no more.</p>`)}
   ${S("Competition benchmarks",`<p>The external scale, for orientation:</p>
    <ul><li>Shuffled deck: 5 min competent, 90s strong, under 20s elite</li>
    <li>Digits in 5 min: 60 / 200 / 500+</li>
    <li>Words in 15 min: 100 / 200 / 300+</li>
    <li>Verbatim prose: a page in 30 min / 15 min / multi-page stable</li></ul>`)}
   ${S("Physiology, which is not optional",`<p>Sleep 7.5 to 9 hours on a consistent schedule. Slow-wave sleep
    drives hippocampal to neocortical consolidation, and this outranks everything else on this page.
    Aerobic exercise 150+ min a week. Study before sleep. Five to ten minutes of wakeful rest right after
    encoding. Alcohol is the worst single input, it suppresses REM and slow-wave sleep. No nootropic has
    evidence for long-term memory-skill development.</p>`)}
   ${S("Four ways this fails at month four",`<ul>
     <li>System-hopping before the first system is automatic</li>
     <li>Encoding without reviewing, so palaces decay in a week</li>
     <li>Palace interference from reusing loci too fast</li>
     <li>Drilling in a vacuum instead of material you actually want</li></ul>`)}
   ${S("Why there is only one 3D chart",`<p>Three dimensions are usually a bad idea in a chart:
    perspective distorts, near bars hide far ones, and you cannot read a value off a tilted surface.
    Almost every 3D chart would have been clearer as a 2D one.</p>
    <p>The exception is when there are genuinely two independent inputs and one measure, which is
    exactly the shape of the flash data: accuracy depends on <i>how many items</i> and <i>how long
    they were up</i>, and those two trade off against each other. A surface shows where the cliff
    runs across that plane, which no single line can. So it is there to show the shape, and the flat
    charts above it are there for reading numbers. Both jobs, each done by the right tool.</p>`)}
   ${S("On the timing numbers",`<p>Exposures are driven by the display refresh, so the real granularity is
    about 17ms on a 60Hz screen, not 1ms. Each trial records its measured on-screen duration rather than the
    requested one. Under roughly 200ms you physically cannot move your eyes, which is the point: that is the
    zone where the drill trains parallel apprehension instead of fast scanning.</p>`)}
 </div></div>`;
}

/* ═══════════ render + boot ═══════════ */
const TABS=[{k:"train",t:"Train",i:ICON.train},{k:"library",t:"Library",i:ICON.library},
            {k:"progress",t:"Progress",i:ICON.progress},{k:"guide",t:"Guide",i:ICON.guide}];
function render(){
 const s=document.getElementById("screen");
 if(R.tab==="train")s.innerHTML=R.sub?screenDrill(R.sub):screenTrain();
 else if(R.tab==="library")s.innerHTML=screenLibrary();
 else if(R.tab==="progress")s.innerHTML=screenProgress();
 else s.innerHTML=screenGuide();
 if(R.tab==="train"&&R.sub)wireDrill(R.sub);
 if(R.tab==="library")wireLibrary();
 if(R.tab==="progress")wireProgress();
 const hi=document.getElementById("hideInstall");
 if(hi)hi.onclick=()=>{ (Store.d.profile.seen=Store.d.profile.seen||{}).install=1;
   Store.saveProfile(); render(); };
 s.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
   const [t,sub]=b.dataset.go.split("|"); go(t,sub||null);
 });
 const ti=document.getElementById("tabinner");
 const idx=TABS.findIndex(t=>t.k===R.tab);
 ti.style.setProperty("--i",idx<0?0:idx);
 [...ti.querySelectorAll(".tab")].forEach((b,k)=>b.setAttribute("aria-selected",k===idx));
}
function buildTabs(){
 const ti=document.getElementById("tabinner");
 TABS.forEach(t=>{
   const b=el("button","tab",`${t.i}<span>${t.t}</span>`);
   b.setAttribute("role","tab"); b.setAttribute("aria-selected","false");
   b.onclick=()=>go(t.k);
   ti.appendChild(b);
 });
}
function themeInit(){
 const btn=document.getElementById("themeBtn");
 const apply=()=>{
   const m=Store.d.profile.theme;
   if(m)document.documentElement.setAttribute("data-theme",m);
   else document.documentElement.removeAttribute("data-theme");
   const dark=m==="dark"||(!m&&matchMedia("(prefers-color-scheme: dark)").matches);
   btn.innerHTML=dark?ICON.sun:ICON.moon;
 };
 btn.onclick=()=>{
   const dark=document.documentElement.getAttribute("data-theme")==="dark"
     ||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
   Store.d.profile.theme=dark?"light":"dark"; Store.saveProfile(); apply();
 };
 apply();
}
/* the shell follows the visible viewport, so the keyboard shrinks it
   instead of shoving the controls off the screen */
function fitViewport(){
 const vv=window.visualViewport;
 const h=Math.round(vv?vv.height:window.innerHeight);
 if(h>200)document.documentElement.style.setProperty("--vvh",h+"px");
 const bh=document.body.getBoundingClientRect().height;
 document.body.classList.toggle("flowmode",bh<200);
}
function watchViewport(){
 try{
  const vv=window.visualViewport;
  if(vv){ vv.addEventListener("resize",fitViewport); vv.addEventListener("scroll",fitViewport); }
  window.addEventListener("resize",fitViewport);
  window.addEventListener("orientationchange",()=>setTimeout(fitViewport,220));
  fitViewport();
 }catch(e){}
}
const STANDALONE=(()=>{try{
  return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
}catch(e){return false;}})();
const IS_IOS=(()=>{try{
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}catch(e){return false;}})();
function haptic(ok){ try{ if(navigator.vibrate)navigator.vibrate(ok?16:[12,55,12]); }catch(e){} }

/* every input the app creates gets phone-friendly behaviour, wherever it is built */
function tuneInput(x){
 if(x.dataset.tuned)return; x.dataset.tuned="1";
 x.setAttribute("autocorrect","off");
 if(!x.hasAttribute("autocapitalize"))x.setAttribute("autocapitalize","off");
 if(!x.hasAttribute("spellcheck"))x.setAttribute("spellcheck","false");
 if(x.tagName==="INPUT"&&!x.hasAttribute("enterkeyhint"))x.setAttribute("enterkeyhint","go");
}
function watchInputs(){
 try{
  document.querySelectorAll("input,textarea").forEach(tuneInput);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    if(n.matches&&n.matches("input,textarea"))tuneInput(n);
    if(n.querySelectorAll)n.querySelectorAll("input,textarea").forEach(tuneInput);
  }))).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("focusin",e=>{
    const t=e.target;
    if(t&&t.matches&&t.matches("input,textarea"))
      setTimeout(()=>{try{t.scrollIntoView({block:"nearest"})}catch(x){}},260);
  });
 }catch(e){}
}
function loadFonts(){
 try{
  const l=document.createElement("link");
  l.rel="stylesheet";
  l.href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700"+
    "&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
  document.head.appendChild(l);
 }catch(e){}
}
function bootError(e){
 const s=document.getElementById("screen");
 if(!s)return;
 s.innerHTML='<div class="wrap"><div class="card">'+
  '<div class="eyebrow">Something went wrong</div>'+
  '<h1 class="h1" style="font-size:22px">Loci Lab could not start</h1>'+
  '<div class="note" style="margin-top:9px">'+esc(String(e&&e.message||e))+'</div>'+
  '<button class="btn wide" id="bReset" style="margin-top:13px">Reset local data and reload</button>'+
  '</div></div>';
 const b=document.getElementById("bReset");
 if(b)b.onclick=()=>{try{localStorage.removeItem("locilab.v1")}catch(x){};location.reload();};
}
function boot(){
 let pending=null;
 try{ pending=Store.init(); }catch(e){ bootError(e); }
 try{ watchViewport(); watchInputs(); }catch(e){}
 if(STANDALONE)document.documentElement.classList.add("standalone");
 try{ buildTabs(); themeInit(); render(); }
 catch(e){ bootError(e); return; }
 if(pending&&pending.then)pending.then(()=>{ render(); try{Sync.init();}catch(e){} })
   .catch(bootError);
 loadFonts();
 setTimeout(()=>{
  const sc=document.getElementById("screen");
  if(sc&&sc.innerHTML.trim().length<40){ try{ render(); }catch(e){ bootError(e); } }
  fitViewport();
 },1500);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&RUN){ if(RUN.onQuit)RUN.onQuit(); else closeRunner(); }
});
</script>
