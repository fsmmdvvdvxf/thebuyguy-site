<style>
:root{color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;
  background:#faf9f5;color:#141413}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<title>Loci Lab</title>
<style>
:root{
  color-scheme:light dark;
  --brand-primary:#3B3A7A; --brand-accent:#2E7D72; --brand-highlight:#D08B2C;
  --bg:#ECEAF2; --surface:#FFFFFF; --surface-2:#F7F6FB;
  --ink:#1A1930; --ink-2:#55547A; --ink-3:#8B8AA6;
  --hairline:rgba(59,58,122,.13); --glass:rgba(255,255,255,.72); --glass-brd:rgba(59,58,122,.12);
  --ok:#2C6E52; --bad:#A63F35; --warn:#D08B2C;
  --stage:#080810; --stage-ink:#F4F4FA; --stage-dim:#4A4A66;
  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --sh1:0 1px 2px rgba(26,25,48,.05),0 2px 8px rgba(26,25,48,.06);
  --sh2:0 8px 24px rgba(26,25,48,.12);
  --f-d:'Fraunces',Georgia,serif; --f-u:'Inter',system-ui,-apple-system,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;
  --bar-h:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand-primary:#8C8BD6; --brand-accent:#57B3A5; --brand-highlight:#E0A24F;
  --bg:#0F0F17; --surface:#1A1A27; --surface-2:#20202F;
  --ink:#EDECF5; --ink-2:#A8A7C0; --ink-3:#73728F;
  --hairline:rgba(140,139,214,.16); --glass:rgba(26,26,39,.76); --glass-brd:rgba(140,139,214,.16);
  --ok:#5FB98C; --bad:#DF7A6E; --warn:#E0A24F;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --sh2:0 8px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --brand-primary:#8C8BD6; --brand-accent:#57B3A5; --brand-highlight:#E0A24F;
  --bg:#0F0F17; --surface:#1A1A27; --surface-2:#20202F;
  --ink:#EDECF5; --ink-2:#A8A7C0; --ink-3:#73728F;
  --hairline:rgba(140,139,214,.16); --glass:rgba(26,26,39,.76); --glass-brd:rgba(140,139,214,.16);
  --ok:#5FB98C; --bad:#DF7A6E; --warn:#E0A24F;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --sh2:0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;font-family:var(--f-u);color:var(--ink);
  height:100vh;height:100svh;height:var(--vvh,100dvh);min-height:320px;
  overflow:hidden;overscroll-behavior:none;
  background:var(--bg);
  background-image:radial-gradient(60vw 40vw at 12% -8%, color-mix(in srgb,var(--brand-primary) 13%,transparent), transparent 70%),
                   radial-gradient(52vw 38vw at 96% 4%, color-mix(in srgb,var(--brand-accent) 12%,transparent), transparent 70%);
  background-attachment:fixed;
  display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.iconbtn svg{width:19px;height:19px}
.tab svg{flex:0 0 auto}
.sec>summary .tile svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--brand-accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

/* ── shell ── */
.brandbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 16px;height:calc(var(--bar-h) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  background:var(--glass);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--glass-brd);z-index:20}
.logo{width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(150deg,var(--brand-primary),var(--brand-accent));
  display:grid;place-items:center;box-shadow:var(--sh1)}
.wordmark{font-family:var(--f-d);font-weight:600;font-size:17px;letter-spacing:-.01em}
.bb-right{margin-left:auto;display:flex;gap:7px;align-items:center}
.screen{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 26px}

/* ── titles ── */
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand-accent);margin-bottom:5px}
.h1{font-family:var(--f-d);font-weight:600;font-size:clamp(27px,7vw,35px);
  letter-spacing:-.015em;line-height:1.1}
.sub{color:var(--ink-2);font-size:14px;margin-top:6px;line-height:1.5}
.h2{font-family:var(--f-d);font-weight:600;font-size:19px;letter-spacing:-.01em}

/* ── buttons: always bubbles ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--hairline);
  background:var(--surface);box-shadow:var(--sh1);font-size:14px;font-weight:600;
  transition:transform .14s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(150deg,var(--brand-primary),
  color-mix(in srgb,var(--brand-primary) 72%,var(--brand-accent)));
  color:#fff;border-color:transparent;box-shadow:var(--sh2)}
.btn.sm{min-height:44px;padding:0 15px;font-size:13px}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.iconbtn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--hairline);background:var(--surface);box-shadow:var(--sh1)}

/* ── cards ── */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);
  box-shadow:var(--sh1);padding:15px}
.stack{display:flex;flex-direction:column;gap:13px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--glass-brd);border-radius:var(--r-lg);box-shadow:var(--sh1)}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;
  padding:13px 15px}
.sec>summary::-webkit-details-marker{display:none}
.sec{overflow:hidden}
.sec .chev{margin-left:auto;transition:transform .25s;color:var(--ink-3)}
.sec[open] .chev{transform:rotate(90deg)}
.sec .body{padding:0 15px 15px}
.sec .summ{font-size:12px;color:var(--ink-3);font-family:var(--f-m);margin-left:auto}
.sec .summ + .chev{margin-left:8px}

/* ── category cards ── */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{--hue:#3B3A7A;position:relative;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid color-mix(in srgb,var(--hue) 26%,transparent);
  background:var(--surface);box-shadow:var(--sh1);padding:0;text-align:left;
  display:flex;flex-direction:column;transition:transform .14s}
.cat:active{transform:scale(.97)}
.cat .hero{aspect-ratio:1.7;display:grid;place-items:center;
  background:radial-gradient(120% 100% at 50% 8%, color-mix(in srgb,var(--hue) 26%,transparent), transparent 72%),
             linear-gradient(165deg, color-mix(in srgb,var(--hue) 15%,var(--surface)), var(--surface))}
.cat .hero svg{width:58%;height:58%;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--hue) 45%,transparent))}
.cat .foot{padding:10px 13px 12px;border-top:1px solid var(--hairline)}
.cat .foot b{display:block;font-family:var(--f-d);font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.cat .foot i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px;
  font-family:var(--f-m)}
.badge{position:absolute;top:9px;right:9px;background:var(--hue);color:#fff;
  font-family:var(--f-m);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;
  box-shadow:var(--sh1)}

/* ── rows / pills ── */
.row{display:flex;align-items:center;gap:11px}
.rowcard{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);
  box-shadow:var(--sh1);text-align:left;transition:transform .14s}
.rowcard:active{transform:scale(.985)}
.tile{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:color-mix(in srgb,var(--hue,var(--brand-primary)) 16%,var(--surface));
  color:var(--hue,var(--brand-primary))}
.tile svg{width:22px;height:22px}
.rowcard .txt{flex:1;min-width:0}
.rowcard .txt b{display:block;font-size:14.5px;font-weight:600}
.rowcard .txt i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--hairline)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn);border-color:transparent}

/* ── form ── */
.field{display:flex;flex-direction:column;gap:6px}
.lab{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{
  background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-sm);
  padding:11px 12px;font-size:15px;width:100%}
textarea{resize:none;line-height:1.55;font-family:var(--f-u)}
input[type=range]{accent-color:var(--brand-primary);width:100%;height:28px}
.segp{display:flex;gap:6px;flex-wrap:wrap}
.segp button{min-height:44px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);
  transition:transform .14s}
.segp button:active{transform:scale(.95)}
.segp button[aria-pressed="true"]{background:var(--brand-primary);color:#fff;border-color:transparent}
.valrow{display:flex;justify-content:space-between;align-items:baseline}
.valrow b{font-family:var(--f-m);font-size:15px;font-variant-numeric:tabular-nums}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 11px;
  border:1px solid var(--hairline)}
.stat b{display:block;font-family:var(--f-m);font-size:19px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.stat i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);margin-top:4px}

/* ── tab bar ── */
.tabbar{flex:0 0 auto;background:var(--glass);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--glass-brd);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabinner{position:relative;display:flex;max-width:520px;margin:0 auto;padding:6px 8px}
.tabslider{position:absolute;top:6px;bottom:6px;left:8px;z-index:0;border-radius:16px;
  width:calc((100% - 16px)/var(--n));transform:translateX(calc(var(--i)*100%));
  background:linear-gradient(160deg,color-mix(in srgb,var(--brand-primary) 22%,var(--surface)),
    color-mix(in srgb,var(--brand-accent) 16%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--brand-primary) 28%,transparent);
  box-shadow:0 6px 16px color-mix(in srgb,var(--brand-primary) 24%,transparent),
    inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .42s cubic-bezier(.34,1.4,.5,1)}
.tab{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:7px 0 6px;background:none;border:0;color:var(--ink-3);
  font-weight:700;font-size:10px;letter-spacing:.02em;transition:color .28s}
.tab svg{width:21px;height:21px;transition:transform .28s}
.tab[aria-selected="true"]{color:var(--brand-primary)}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.09)}

/* ── runner (full-screen takeover) ── */
.runner{position:fixed;left:0;top:0;right:0;z-index:60;background:var(--bg);
  height:var(--vvh,100dvh);display:flex;flex-direction:column}
.rbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 14px;
  height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-brd)}
.rbar .nm{font-family:var(--f-d);font-weight:600;font-size:15px}
.prog{flex:1;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;
  border:1px solid var(--hairline)}
.prog span{display:block;height:100%;background:var(--brand-accent);
  transition:width .3s cubic-bezier(.34,1.4,.5,1)}
.rmid{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1 1 auto;min-height:80px;background:var(--stage);color:var(--stage-ink);
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:20px 16px;user-select:none;overflow:hidden}
.stim{font-family:var(--f-m);font-size:clamp(26px,7.5vw,58px);font-weight:500;
  letter-spacing:.06em;text-align:center;max-width:20ch;line-height:1.35;word-break:break-word}
.stim.serif{font-family:var(--f-d);letter-spacing:0;max-width:17ch;font-size:clamp(22px,5.6vw,42px)}
.stim.small{font-size:clamp(18px,4.4vw,30px);max-width:26ch}
.cross{font-family:var(--f-m);font-size:40px;color:var(--stage-dim)}
.mask{font-family:var(--f-m);font-size:clamp(26px,7.5vw,58px);color:#20203a;letter-spacing:.06em}
.stagehint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--stage-dim)}
.rdeck{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--hairline);
  padding:13px 14px calc(13px + env(safe-area-inset-bottom,0px));
  max-height:70%;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px}
.rdeck input[type=text]{font-family:var(--f-m);font-size:17px;min-height:50px}
.rdeck .btn.pri{min-height:50px}
.verdict{min-height:24px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:14px}
.verdict .truth{font-family:var(--f-m);font-weight:500}
.verdict .mine{font-family:var(--f-m);font-size:12px;color:var(--ink-3)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:8px;height:16px;border-radius:2px;background:var(--surface-2);
  border:1px solid var(--hairline)}
.dot.y{background:var(--ok);border-color:transparent}
.dot.n{background:var(--bad);border-color:transparent}

/* ── schulte ── */
.schulte{display:grid;gap:6px;width:min(92vw,52vh,420px);aspect-ratio:1}
.schulte button{border-radius:9px;border:1px solid #1e1e33;background:#12121f;
  color:var(--stage-ink);font-family:var(--f-m);font-size:clamp(13px,3.6vw,20px);
  display:grid;place-items:center;transition:transform .1s}
.schulte button:active{transform:scale(.93)}
.schulte button.hit{background:var(--brand-accent);border-color:transparent;color:#03110e}
.schulte button.err{background:var(--bad);border-color:transparent}
.mgrid{display:grid;gap:6px;width:min(88vw,48vh,380px);aspect-ratio:1}
.mgrid div,.mgrid button{border-radius:8px;border:1px solid #1e1e33;background:#12121f}
.mgrid .on{background:var(--brand-highlight);border-color:transparent}
.mgrid button.pick{background:var(--brand-primary);border-color:transparent}

/* ── slots (mental math) ── */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,440px)}
.slot{border:1px dashed #2a2a46;border-radius:12px;padding:10px 8px;text-align:center;
  min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.slot.beat{border-color:var(--brand-highlight);background:rgba(208,139,44,.09)}
.slot b{font-family:var(--f-m);font-size:19px;font-variant-numeric:tabular-nums}
.slot i{font-style:normal;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--stage-dim)}

/* ── chart ── */
.chartbox{overflow-x:auto}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.legend button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid var(--hairline);background:var(--surface)}
.legend button[aria-pressed="false"]{opacity:.38}
.swatch{width:9px;height:9px;border-radius:50%}

/* ── ladder ── */
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{display:grid;grid-template-columns:1fr auto auto auto;gap:9px;align-items:center;
  font-size:12.5px;padding:9px 11px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--hairline)}
.rung b{font-family:var(--f-m);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500;
  text-align:right;color:var(--ink-3)}
.rung b.here{color:var(--brand-accent);font-weight:600}
.rung .nm{font-weight:600;font-size:13px;color:var(--ink)}

/* ── misc ── */
.note{font-size:13px;color:var(--ink-3);line-height:1.6}
.prose{font-size:14px;line-height:1.65;color:var(--ink-2)}
.prose p{margin:0 0 10px}
.prose b,.prose strong{color:var(--ink);font-weight:600}
.prose ul{margin:0 0 10px;padding-left:18px}
.prose li{margin-bottom:5px}
.reveal{animation:rise .45s cubic-bezier(.22,1,.36,1)}
.d1,.d2,.d3,.d4{animation-delay:0s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .34s cubic-bezier(.34,1.4,.5,1)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ── equation stage (Balance) ── */
.eq{width:min(94vw,540px);display:flex;flex-direction:column;align-items:stretch;gap:0}
.eqgrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0 14px}
.eqgrid .side{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:nowrap}
.eqgrid .side:first-child{justify-content:flex-end}
.eqgrid .side:last-child{justify-content:flex-start}
.eqgrid{gap:0 10px}
.eqrow{font-family:var(--f-m);font-size:clamp(21px,6vw,38px);font-weight:500;min-height:1.6em}
.eqeq{opacity:.5}
.term{display:inline-flex;align-items:center;white-space:nowrap;
  transition:transform .3s cubic-bezier(.34,1.3,.5,1),opacity .28s,color .2s}
.term.hit{color:var(--brand-highlight)}
.term.gone{opacity:0;transform:scale(.55)}
.term.flash{animation:termpop .42s cubic-bezier(.34,1.4,.5,1)}
@keyframes termpop{0%{transform:scale(.72);opacity:.25}58%{transform:scale(1.13)}100%{transform:scale(1)}}
.oprule{height:1px;background:#2b2b48;transform:scaleX(0);transform-origin:center;

     }
     for(const [k,coll] of [["sets","sets"],["cards","cards"],["sessions","sessions"],["passages","passages"]]){
       const snap=await db.collection(coll).get();
       const rows=(snap?.docs||snap||[]).map(d=>d.data?d.data:d).filter(Boolean);
       if(rows.length)cache[k]=rows;
     }
     if(!cache.cards.length)cache.cards=seedCards();

     ready=true; lsWrite(); render();
   }catch(e){ ready=true; }

 }

   cache.profile.savedAt=new Date().toISOString();

   if(db){try{await db.doc("profile/main").set(cache.profile)}catch(e){}}
 }
 function persist(){ lsWrite(); }
 return {init,put,drop,saveProfile,persist,get d(){return cache},get live(){return !!db},get ready(){return ready}};
})();

 /* pegs arrive 10 a day for ten days rather than 100 at once */

/* ═══════════ 3-down / 1-up transformed staircase (Levitt 1971) ═══════════ */
function mkStair(v0,min,max){return{v:v0,min,max,run:0,dir:0,rev:[],f:.8};}
function stairStep(s,ok){
 const flip=d=>{ if(s.dir&&s.dir!==d){ s.rev.push(s.v);
     if(s.rev.length===2)s.f=.87; else if(s.rev.length===4)s.f=.93; }
   s.dir=d; };
 if(ok){ s.run++;
   if(s.run>=3){ s.run=0; flip(-1); s.v=clamp(s.v*s.f,s.min,s.max); } }
 else { s.run=0; flip(1); s.v=clamp(s.v/s.f,s.min,s.max); }
 return s.v;
}
function stairThreshold(s){
 if(s.rev.length<4)return null;
 let r=s.rev.slice(-6); if(r.length%2)r=r.slice(1);
 return mean(r);
}

<script>

function runFlash(){

/* ═══════════ DRILL: Mental Math ═══════════ */
function evalChain(tok){
 const a=[...tok];
 for(let k=1;k<a.length;k+=2){
   if(a[k]==="x"||a[k]==="/"){
     const v=a[k]==="x"?a[k-1]*a[k+1]:a[k-1]/a[k+1];
     a.splice(k-1,3,v); k-=2;
   }
 }
 let v=a[0];
 for(let k=1;k<a.length;k+=2) v=a[k]==="+"?v+a[k+1]:v-a[k+1];
 return v;
}
function genMath(cfg){
 const lo=Math.pow(10,cfg.digits-1), hi=Math.pow(10,cfg.digits)-1;
 for(let t=0;t<300;t++){
   const tok=[rnd(hi-lo+1)+lo];
   for(let s=0;s<cfg.steps;s++){
     const op=pick(cfg.ops);
     let n=rnd(hi-lo+1)+lo;
     if(op==="x"&&cfg.digits>2)n=rnd(12)+2;
     if(op==="/")n=rnd(9)+2;
     tok.push(op,n);
   }
   const v=evalChain(tok);
   if(Number.isInteger(v)&&v>0&&Math.abs(v)<1e7)
     return {text:tok.map(x=>x==="x"?"×":x==="/"?"÷":x).join(" "),answer:v};
 }
 return {text:"12 × 12",answer:144};
}
function runMath(){

       <p>Saying each one out loud as you park it puts a second, independent copy in your

       signal dropping mid-problem.</p></div>`;
     r.deck.appendChild(box);
   };
 }

   finishSession({drill:"math",trials:i,correct,results:res,rows,threshold:avg,
     thrUnit:"s / problem",ms:performance.now()-t0,drops,
     note:`${avg.toFixed(1)}s average per problem${cfg.scaffold?`, ${drops} signal drop${drops===1?"":"s"} logged`:""}.`});
 }
 r.onQuit=()=>{ clearInterval(beatT); if(i>0)done(); else {closeRunner();render();} };

/* ═══════════ DRILL: Grid ═══════════ */
function runGrid(){

 let i=0,correct=0,res=[],times=[],t0=performance.now(),rows=[];

 r.deck.innerHTML=`<div class="verdict" id="rVerdict"></div>

     <div class="dots" id="rDots"></div>
     <div class="note" id="rMeta" style="font-family:var(--f-m)"></div></div>`;
 const dots=()=>r.deck.querySelector("#rDots").innerHTML=dotsHTML(res);
 function trial(){
   if(i>=cfg.trials)return done();
   setProg(i,cfg.trials);
   r.deck.querySelector("#rMeta").textContent=cfg.mode==="schulte"
     ? `${cfg.size} x ${cfg.size}` : `${cfg.flashN} cells / ${Math.round(stair.v)}ms`;
   cfg.mode==="schulte"?schulte():matrix();
 }
 function schulte(){
   const n=cfg.size, N=n*n, order=sample([...Array(N).keys()].map(k=>k+1),N);
   let want=1,errs=0,ts=performance.now();
   r.stage.innerHTML="";
   const g=el("div","schulte");
   g.style.gridTemplateColumns=`repeat(${n},1fr)`;
   order.forEach(v=>{
     const b=el("button","",String(v)); b.dataset.v=v;
     b.onclick=()=>{
       if(+b.dataset.v===want){ b.classList.add("hit"); want++;
         if(want>N){ const dt=performance.now()-ts; times.push(dt);
           const ok=errs<=1; rows.push({ok,ms:Math.round(dt),size:cfg.size});
           res.push(ok); if(ok)correct++; i++; dots();
           verdict(ok,`${(dt/1000).toFixed(1)}s, ${errs} error${errs===1?"":"s"}`,"",trial,1300); } }
       else { errs++; b.classList.add("err"); setTimeout(()=>b.classList.remove("err"),260); }
     };
     g.appendChild(b);
   });
   r.stage.appendChild(g);
   r.stage.appendChild(el("div","stagehint",`Fixate the centre, find 1 to ${N} in order`));
 }
 function matrix(){
   const n=cfg.size,N=n*n;
   const on=sample([...Array(N).keys()],Math.min(cfg.flashN,N));
   r.stage.innerHTML="";
   r.stage.appendChild(el("div","stim",'<span class="cross">+</span>'));
   later(()=>{
     const g=el("div","mgrid"); g.style.gridTemplateColumns=`repeat(${n},1fr)`;
     for(let k=0;k<N;k++) g.appendChild(el("div",on.includes(k)?"on":""));
     flashNode(r.stage,g,stair.v,()=>ask(n,N,on));
   },700);
 }
 function ask(n,N,on){
   const picked=new Set();
   r.stage.innerHTML="";
   const g=el("div","mgrid"); g.style.gridTemplateColumns=`repeat(${n},1fr)`;
   for(let k=0;k<N;k++){
     const b=el("button",""); b.setAttribute("aria-label","cell "+(k+1));
     b.onclick=()=>{
       if(picked.has(k)){picked.delete(k);b.classList.remove("pick");}
       else{picked.add(k);b.classList.add("pick");}
       if(picked.size===on.length){
         const ok=on.every(x=>picked.has(x));
         rows.push({ok,cells:on.length,exp:Math.round(stair.v)});
         res.push(ok); if(ok)correct++; i++; stairStep(stair,ok); dots();
         g.querySelectorAll("button").forEach((bb,kk)=>{if(on.includes(kk))bb.classList.add("pick");});
         verdict(ok,`${on.length} cells`,"",trial,1300);
       }
     };
     g.appendChild(b);
   }
   r.stage.appendChild(g);
   r.stage.appendChild(el("div","stagehint",`Tap the ${on.length} cells that were lit`));
 }
 function done(){
   setProg(cfg.trials,cfg.trials);
   let note,thr,unit;
   if(cfg.mode==="schulte"){ thr=mean(times)/1000; unit="s / table";
     cfg.best=cfg.best==null?thr:Math.min(cfg.best,thr);
     note=`${thr.toFixed(1)}s average per table.`; }
   else { thr=stairThreshold(stair); unit="ms @79%"; cfg.exp=Math.round(stair.v);
     note=`Exposure settled at ${Math.round(stair.v)}ms for ${cfg.flashN} cells.`; }
   Store.saveProfile();
   finishSession({drill:"grid",mode:cfg.mode,trials:i,correct,results:res,rows,
     threshold:thr,thrUnit:unit,ms:performance.now()-t0,note});
 }
 r.onQuit=()=>{ if(i>0)done(); else {closeRunner();render();} };
 trial();
}

/* ═══════════ DRILL: Patterns (SM-2) ═══════════ */
function dueCards(){ const t=today(); return Store.d.cards.filter(c=>c.due<=t); }
function gradeCard(c,q){
 const ef=Math.max(1.3,c.ef+(0.1-(3-q)*(0.08+(3-q)*0.02)));
 let ivl;
 if(q===0){ ivl=0; c.reps=0; }
 else if(c.reps===0)ivl=1;
 else if(c.reps===1)ivl=q===1?3:6;
 else ivl=Math.round((c.ivl||1)*(q===1?1.2:ef));
 c.ef=ef; c.ivl=ivl; c.reps=q===0?0:(c.reps||0)+1;
 c.due=new Date(Date.now()+Math.max(0,ivl)*864e5).toISOString().slice(0,10);
 return c;
}
function runPattern(){
 const cfg=Store.d.profile.drills.pattern;
 const due=dueCards();
 const queue=sample(due,Math.min(cfg.trials,due.length));
 const r=openRunner("Patterns");
 if(!queue.length){
   r.stage.innerHTML=`<div class="stim small">Nothing due today.
     <div style="font-size:.5em;color:var(--stage-dim);font-family:var(--f-u);margin-top:12px;line-height:1.6">
     Spaced repetition means the rest days are part of the method. Come back tomorrow.</div></div>`;
   r.deck.innerHTML=`<button class="btn pri wide" id="rD">Back</button>`;
   r.deck.querySelector("#rD").onclick=()=>{closeRunner();render();};
   r.onQuit=()=>{closeRunner();render();};
   return;
 }
 let i=0,correct=0,res=[],t0=performance.now();
 function trial(){
   if(i>=queue.length)return done();
   setProg(i,queue.length);
   const c=queue[i];
   r.stage.innerHTML="";
   r.stage.appendChild(el("div","stim serif",esc(c.front)));
   r.stage.appendChild(el("div","stagehint",c.deck==="pegs"?"Major System peg":"Name the form"));
   r.deck.innerHTML=`<button class="btn pri wide" id="rShow">Show answer</button>
     <div class="dots">${dotsHTML(res)}</div>`;
   r.deck.querySelector("#rShow").onclick=()=>reveal(c);
 }
 function reveal(c){
   r.stage.innerHTML="";
   r.stage.appendChild(el("div","stim small",
     `<div style="color:var(--stage-dim);font-size:.62em;margin-bottom:12px">${esc(c.front)}</div>${esc(c.back)}`));
   r.deck.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
     <button class="btn sm" data-q="0" style="color:var(--bad)">Again</button>
     <button class="btn sm" data-q="1">Hard</button>
     <button class="btn sm" data-q="2">Good</button>
     <button class="btn sm" data-q="3" style="color:var(--ok)">Easy</button></div>
     <div class="dots">${dotsHTML(res)}</div>`;
   r.deck.querySelectorAll("[data-q]").forEach(b=>b.onclick=async()=>{
     const q=+b.dataset.q, ok=q>=2;
     res.push(ok); if(ok)correct++; i++;
     await Store.put("cards",gradeCard(c,q));
     trial();
   });
 }
 function done(){
   setProg(queue.length,queue.length);
   const left=dueCards().length;
   finishSession({drill:"pattern",trials:i,correct,results:res,ms:performance.now()-t0,
     note:`${left} card${left===1?"":"s"} still due today.`});
 }
 r.onQuit=()=>{ if(i>0)done(); else {closeRunner();render();} };
 trial();
}

/* ═══════════ DRILL: Verbatim ═══════════ */
function chunkText(t){
 const parts=t.replace(/([,.;:?!])\s+/g,"$1").split("");
 const out=[];
 for(const p of parts){
   const w=p.trim().split(/\s+/).filter(Boolean);
   if(!w.length)continue;
   if(w.length<=7)out.push(w.join(" "));
   else for(let k=0;k<w.length;k+=5)out.push(w.slice(k,k+5).join(" "));
 }
 const m=[];
 for(const c of out){
   const last=m[m.length-1];
   if(last&&c.split(" ").length<=2&&last.split(" ").length+c.split(" ").length<=7)
     m[m.length-1]=last+" "+c;
   else m.push(c);
 }
 return m;
}
function skeleton(s){ return s.split(/\s+/).map(w=>w[0]).join(" "); }
function clozed(s,pct){
 const w=s.split(/\s+/);
 const n=Math.max(1,Math.round(w.length*pct));
 const idx=sample([...w.keys()],n);
 return w.map((x,k)=>idx.includes(k)?"—".repeat(Math.max(2,Math.min(6,x.length))):x).join(" ");
}
function lcsDiff(a,b){
 const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let x=n-1;x>=0;x--)for(let y=m-1;y>=0;y--)
   dp[x][y]=a[x]===b[y]?dp[x+1][y+1]+1:Math.max(dp[x+1][y],dp[x][y+1]);
 const out=[]; let x=0,y=0;
 while(x<n&&y<m){
   if(a[x]===b[y]){out.push(["=",a[x]]);x++;y++;}
   else if(dp[x+1][y]>=dp[x][y+1]){out.push(["-",a[x]]);x++;}
   else {out.push(["+",b[y]]);y++;}
 }
 while(x<n)out.push(["-",a[x++]]);
 while(y<m)out.push(["+",b[y++]]);
 return {ops:out,hits:dp[0][0]};
}
function runVerbatim(){
 const cfg=Store.d.profile.drills.verbatim;
 const P=Store.d.passages.find(p=>p.id===cfg.passageId)||Store.d.passages[0];
 if(!P)return;
 const chunks=chunkText(P.text);
 const stage=cfg.stage||1;
 const names={1:"Place",2:"Skeleton",3:"Cloze",4:"Blank"};
 const r=openRunner("Verbatim / "+names[stage]);
 let i=0,correct=0,res=[],t0=performance.now();
 if(stage===4){ blankStage(); return; }
 r.deck.innerHTML=`<div class="verdict" id="rVerdict"></div>
   <div class="row"><input type="text" id="rIn" placeholder="${stage===1?"Press Enter once you have placed it":"Type the phrase"}"
     autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pri" id="rGo">Enter</button></div>
   <div class="dots" id="rDots"></div>`;
 const inp=r.deck.querySelector("#rIn");
 function trial(){
   if(i>=chunks.length)return done();
   setProg(i,chunks.length);
   inp.value="";inp.focus();
   const c=chunks[i];
   const third=Math.max(1,chunks.length/3);
   const show=stage===1?c:stage===2?skeleton(c)
     :clozed(c,[.2,.5,.8][Math.min(2,Math.floor(i/third))]);
   r.stage.innerHTML="";
   r.stage.appendChild(el("div","stim serif small",esc(show)));
   r.stage.appendChild(el("div","stagehint",
     `Locus ${i+1} of ${chunks.length}${stage===1?", say it aloud as you place it":""}`));
 }
 function submit(){
   const c=chunks[i];
   const ok=stage===1?true:normText(inp.value)===normText(c);
   res.push(ok); if(ok)correct++; i++;
   r.deck.querySelector("#rDots").innerHTML=dotsHTML(res);
   if(stage===1)verdict(true,c,"",trial,420);
   else verdict(ok,c,inp.value,trial);
 }
 inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit();}};
 r.deck.querySelector("#rGo").onclick=submit;
 function done(){
   setProg(chunks.length,chunks.length);
   const pct=correct/Math.max(1,chunks.length);
   let note=`${Math.round(pct*100)}% of loci clean.`;
   if(pct>=.9&&stage<4){ cfg.stage=stage+1; note+=` Stage ${stage+1}, ${names[stage+1]}, unlocked.`; }
   else if(stage<4)note+=` Stay on ${names[stage]} until you clear 90%.`;
   Store.saveProfile();
   finishSession({drill:"verbatim",passageId:P.id,stage,trials:chunks.length,correct,
     results:res,ms:performance.now()-t0,note});
 }
 r.onQuit=()=>{ if(i>0)done(); else {closeRunner();render();} };
 trial();

 function blankStage(){
   r.stage.innerHTML="";
   r.stage.appendChild(el("div","stim small",
     `<div style="font-family:var(--f-d);font-size:.82em">${esc(P.name)}</div>
      <div style="font-size:.46em;color:var(--stage-dim);font-family:var(--f-u);margin-top:12px">
      ${chunks.length} loci, from memory, whole</div>`));
   r.deck.innerHTML=`<textarea id="rTA" rows="4" placeholder="Type the whole passage from memory"></textarea>
     <button class="btn pri wide" id="rGo2">Score it</button><div id="rOut"></div>`;
   const ta=r.deck.querySelector("#rTA"), go2=r.deck.querySelector("#rGo2");
   ta.oninput=()=>{ta.style.height="auto";ta.style.height=Math.min(180,ta.scrollHeight)+"px";};
   ta.focus();
   go2.onclick=()=>{
     const a=words(P.text),b=words(ta.value);
     const d=lcsDiff(a,b), pct=d.hits/Math.max(1,a.length);
     r.stage.innerHTML="";
     const html=d.ops.map(([k,w])=>k==="="?esc(w)
       :k==="-"?`<span style="color:#DF7A6E;text-decoration:line-through">${esc(w)}</span>`
       :`<span style="color:#E0A24F">${esc(w)}</span>`).join(" ");
     r.stage.appendChild(el("div","stim small",
       `<div style="font-size:.5em;line-height:1.75;font-family:var(--f-u);max-width:34ch">${html}</div>`));
     r.deck.querySelector("#rOut").innerHTML=`<div class="note" style="margin-top:6px">
       <b style="color:var(--ink)">${Math.round(pct*100)}%</b> recovered in order.
       Struck words you missed, amber words you added.</div>`;
     go2.textContent="Finish";
     go2.onclick=()=>finishSession({drill:"verbatim",passageId:P.id,stage:4,
       trials:a.length,correct:d.hits,results:[],ms:performance.now()-t0,
       note:`${Math.round(pct*100)}% recovered verbatim.`});
   };
   r.onQuit=()=>{closeRunner();render();};
 }
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   EQ — a linear equation as two sides, each a*x + b.
   Every operation hits both sides with the same rule, which is
   what "balance" means and what makes the model trivially right.
   ═══════════════════════════════════════════════════════════ */
const MINUS="−";
const fmtN=v=>{
 if(Number.isInteger(v))return String(v).replace("-",MINUS);
 return String(Math.round(v*1000)/1000).replace("-",MINUS);
};
const EQ={
 apply(eq,op,k,isX){
  const f=s=>{
   if(op==="+")return isX?{a:s.a+k,b:s.b}:{a:s.a,b:s.b+k};
   if(op==="-")return isX?{a:s.a-k,b:s.b}:{a:s.a,b:s.b-k};
   if(op==="*")return {a:s.a*k,b:s.b*k};
   return {a:s.a/k,b:s.b/k};
  };
  return {L:f(eq.L),R:f(eq.R)};
 },
 solved(eq){ return eq.L.a===1&&eq.L.b===0&&eq.R.a===0; },
 valid(eq){ return [eq.L.a,eq.L.b,eq.R.a,eq.R.b].every(Number.isFinite); },
 terms(s){
  const out=[];
  if(s.a!==0){
   const c=s.a===1?"":s.a===-1?MINUS:fmtN(s.a);
   out.push({t:c+"x",kind:"x",v:s.a});
  }
  if(s.b!==0||s.a===0){
   if(out.length){ out.push({t:s.b<0?MINUS:"+",kind:"sign"});
     out.push({t:fmtN(Math.abs(s.b)),kind:"c",v:s.b}); }
   else out.push({t:fmtN(s.b),kind:"c",v:s.b});
  }
  return out;
 },
 sideStr(s){ return EQ.terms(s).map(t=>t.t).join(" "); },
 str(eq){ return EQ.sideStr(eq.L)+" = "+EQ.sideStr(eq.R); },
 /* the canonical route: clear the x on the right, clear the constant, then divide */
 solve(eq){
  const steps=[]; let e={L:{...eq.L},R:{...eq.R}};
  if(e.R.a!==0){ const k=e.R.a; const op=k>0?"-":"+";
    steps.push({op,k:Math.abs(k),isX:true}); e=EQ.apply(e,op,Math.abs(k),true); }
  if(e.L.b!==0){ const op=e.L.b>0?"-":"+";
    steps.push({op,k:Math.abs(e.L.b),isX:false}); e=EQ.apply(e,op,Math.abs(e.L.b),false); }
  if(e.L.a!==1){ steps.push({op:"/",k:e.L.a,isX:false}); e=EQ.apply(e,"/",e.L.a,false); }
  return {steps,answer:e.R.b};
 },
 gen(tier){
  const r=(lo,hi)=>rnd(hi-lo+1)+lo;
  const x0=r(-9,12)||3;
  if(tier<=1){ const b=r(-12,14)||5; return {L:{a:1,b},R:{a:0,b:x0+b}}; }
  if(tier===2){ const a=r(2,9), b=r(-14,16); return {L:{a,b},R:{a:0,b:a*x0+b}}; }
  if(tier===3){ let a=r(2,9),c=r(1,6); if(a===c)c=a===9?2:a+1;
    const b=r(-12,14); const d=a*x0+b-c*x0; return {L:{a,b},R:{a:c,b:d}}; }
  let a=r(-11,11); if(Math.abs(a)<2)a=5;
  let c=r(-9,9); if(c===a)c=a>0?a-3:a+3;
  const b=r(-20,22); const d=a*x0+b-c*x0;
  return {L:{a,b},R:{a:c,b:d}};
 },
 /* parse "+5", "-3x", "*2", "/4", "×2", "÷4" */
 parse(txt){
  const t=String(txt).trim().replace(/×/g,"*").replace(/÷/g,"/")
    .replace(/[−–—]/g,"-").replace(/\s+/g,"");
  const m=t.match(/^([+\-*/])(\d+(?:\.\d+)?)(x?)$/i);
  if(!m)return null;
  const k=parseFloat(m[2]); if(!k)return null;
  const isX=m[3].toLowerCase()==="x";
  if((m[1]==="*"||m[1]==="/")&&isX)return null;
  return {op:m[1],k,isX};
 },
 label(st){
  const sym=st.op==="*"?"×":st.op==="/"?"÷":st.op==="-"?MINUS:"+";
  return sym+fmtN(st.k).replace(MINUS,"")+(st.isX?"x":"");
 }
};

/* ── the animation: drop under both sides, push up, merge, settle ── */
function eqMarkup(){
 return `<div class="eq">
   <div class="eqgrid eqrow" id="eqMain">
     <div class="side" id="eqL"></div><div class="eqeq">=</div><div class="side" id="eqR"></div>
   </div>
   <div class="oprule" id="eqRule"></div>
   <div class="eqgrid eqrow oprow" id="eqOp">
     <div class="side"><span class="opchip" id="opL"></span></div>
     <div class="eqeq" style="opacity:0">=</div>
     <div class="side"><span class="opchip" id="opR"></span></div>
   </div>
   <div class="steplog" id="eqLog"></div>
 </div>`;
}
function paintSide(node,side,flashKinds){
 node.innerHTML=EQ.terms(side).map(t=>
   `<span class="term${flashKinds&&flashKinds.includes(t.kind)?" flash":""}"
     data-kind="${t.kind}">${t.t}</span>`).join(" ");
}
function paintEq(root,eq){
 paintSide(root.querySelector("#eqL"),eq.L);
 paintSide(root.querySelector("#eqR"),eq.R);
 root.querySelector("#eqMain").classList.toggle("eqsolved",EQ.solved(eq));
}
const REDUCED=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

function animateStep(root,eq,st,speed,done){
 const next=EQ.apply(eq,st.op,st.k,st.isX);
 const rule=root.querySelector("#eqRule"), row=root.querySelector("#eqOp");
 const lab=EQ.label(st);
 root.querySelector("#opL").textContent=lab;
 root.querySelector("#opR").textContent=lab;
 if(REDUCED()){ paintEq(root,next); done(next); return; }
 const m=1/(speed||1);
 const hitKinds=(st.op==="*"||st.op==="/")?["x","c","sign"]:(st.isX?["x"]:["c","sign"]);
 const mark=on=>root.querySelectorAll("#eqMain .term").forEach(t=>{
   if(hitKinds.includes(t.dataset.kind))t.classList.toggle("hit",on);});
 /* 1 · drop */
 rule.classList.add("show"); row.classList.add("show");
 later(()=>{ /* 2 · push */
   row.classList.add("push"); mark(true);
 },260*m);
 later(()=>{ /* 3 · merge */
   row.classList.add("done");
   paintSide(root.querySelector("#eqL"),next.L,hitKinds);
   paintSide(root.querySelector("#eqR"),next.R,hitKinds);
 },580*m);
 later(()=>{ /* 4 · settle */
   row.classList.remove("show","push","done"); rule.classList.remove("show");
   root.querySelector("#eqMain").classList.toggle("eqsolved",EQ.solved(next));
   done(next);
 },820*m);
}

/* ═══════════ DRILL: Balance ═══════════ */
function runBalance(){
 const cfg=Store.d.profile.drills.balance;
 const r=openRunner("Balance / "+(cfg.mode==="head"?"Head first":"Guided"));
 let i=0,correct=0,res=[],rows=[],t0=performance.now();
 let eq=null,plan=null,steps=0,tStart=0,solvedNow=false;
 const speed=cfg.speed||1;

 function trial(){
  if(i>=cfg.trials)return done();
  setProg(i,cfg.trials);
  eq=EQ.gen(cfg.tier); plan=EQ.solve(eq); steps=0; solvedNow=false;
  r.stage.innerHTML=eqMarkup();
  paintEq(r.stage,eq);
  tStart=performance.now();
  cfg.mode==="head"?deckHead():deckGuided();
 }
 const logLine=(txt)=>{
  const L=r.stage.querySelector("#eqLog");
  if(L)L.innerHTML+=(L.innerHTML?"<br>":"")+txt;
 };

 /* ── guided: you choose every operation ── */
 function deckGuided(){
  const s=eq;
  const sug=[];
  if(s.R.a!==0)sug.push((s.R.a>0?"-":"+")+Math.abs(s.R.a)+"x");
  if(s.L.b!==0)sug.push((s.L.b>0?"-":"+")+Math.abs(s.L.b));
  sug.push("/"+(s.L.a||1),"+1","-1");
  const chips=[...new Set(sug)].slice(0,5);
  r.deck.innerHTML=`<div class="verdict" id="rVerdict"></div>
    <div class="opbar">${chips.map(c=>`<button data-op="${esc(c)}">${esc(c.replace("-",MINUS).replace("*","×").replace("/","÷"))}</button>`).join("")}</div>
    <div class="row"><input type="text" id="rIn" placeholder="or type an operation, e.g. -5 or /3"
      autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn pri" id="rGo">Apply</button></div>
    <div class="row" style="justify-content:space-between">
      <div class="dots" id="rDots">${dotsHTML(res)}</div>
      <div class="note" style="font-family:var(--f-m)">step ${steps} / best ${plan.steps.length}</div></div>`;
  const inp=r.deck.querySelector("#rIn");
  const fire=txt=>{
   const st=EQ.parse(txt);
   if(!st){ inp.value=""; inp.placeholder="Not an operation. Try -5, +3x, /2"; return; }
   const busy=r.deck.querySelector("#rGo");
   busy.disabled=true;
   steps++;
   logLine(`<b>${esc(EQ.label(st))}</b> on both sides`);
   animateStep(r.stage,eq,st,speed,n=>{
     eq=n;
     if(!EQ.valid(eq)){ finish(false); return; }
     if(EQ.solved(eq)){ finish(true); return; }
     deckGuided();
   });
  };
  r.deck.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>fire(b.dataset.op));
  r.deck.querySelector("#rGo").onclick=()=>fire(inp.value);
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();fire(inp.value);}};
  inp.focus();
 }
 function finish(reachedSolution){
  if(solvedNow)return; solvedNow=true;
  const dt=performance.now()-tStart;
  const ok=reachedSolution&&steps<=plan.steps.length+1;
  res.push(ok); if(ok)correct++;
  rows.push({ok,ms:Math.round(dt),steps,optimal:plan.steps.length,tier:cfg.tier});
  i++;
  r.deck.querySelector("#rDots").innerHTML=dotsHTML(res);
  verdict(ok, reachedSolution?`x = ${fmtN(eq.R.b)} in ${steps} step${steps===1?"":"s"} (best ${plan.steps.length})`
    :"that went somewhere unsolvable", "", trial, ok?1300:2200);
 }

 /* ── head first: solve silently, then watch the canonical run ── */
 function deckHead(){
  r.deck.innerHTML=`<div class="verdict" id="rVerdict"></div>
    <div class="row"><input type="text" id="rIn" inputmode="text" placeholder="x = ?"
      autocomplete="off" spellcheck="false"><button class="btn pri" id="rGo">Enter</button></div>
    <div class="row" style="justify-content:space-between">
      <div class="dots" id="rDots">${dotsHTML(res)}</div>
      <div class="note">Solve it in your head, then watch it play back.</div></div>`;
  const inp=r.deck.querySelector("#rIn");
  const sub=()=>{
   if(inp.disabled)return;
   const v=parseFloat(String(inp.value).replace(/[^\d.\-−]/g,"").replace(MINUS,"-"));
   const ok=Math.abs(v-plan.answer)<1e-9;
   const dt=performance.now()-tStart;
   res.push(ok); if(ok)correct++;
   rows.push({ok,ms:Math.round(dt),steps:plan.steps.length,optimal:plan.steps.length,tier:cfg.tier});
   i++;
   inp.disabled=true; r.deck.querySelector("#rGo").disabled=true;
   r.deck.querySelector("#rDots").innerHTML=dotsHTML(res);
   const v2=r.deck.querySelector("#rVerdict");
   v2.innerHTML=`<span class="pill ${ok?"ok":"bad"}">${ok?"Correct":"Miss"}</span>
     <span class="truth">x = ${fmtN(plan.answer)}</span>`+
     (ok?"":`<span class="mine">you: ${esc(inp.value||"—")}</span>`);
   playback(0);
  };
  r.deck.querySelector("#rGo").onclick=sub;
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sub();}};
  inp.focus();
 }
 function playback(k){
  if(k>=plan.steps.length){ later(trial,900); return; }
  const st=plan.steps[k];
  logLine(`<b>${esc(EQ.label(st))}</b> on both sides`);
  animateStep(r.stage,eq,st,speed,n=>{ eq=n; later(()=>playback(k+1),140); });
 }

 function done(){
  setProg(cfg.trials,cfg.trials);
  const avg=mean(rows.map(x=>x.ms))/1000;
  const extra=mean(rows.map(x=>x.steps-x.optimal));
  cfg.best=cfg.best==null?avg:Math.min(cfg.best,avg);
  Store.saveProfile();
  finishSession({drill:"balance",mode:cfg.mode,tier:cfg.tier,trials:i,correct,results:res,rows,
    threshold:avg,thrUnit:"s / equation",ms:performance.now()-t0,
    note:`${avg.toFixed(1)}s per equation`+
      (cfg.mode==="head"?"":`, ${extra<=0.05?"no wasted steps":extra.toFixed(1)+" extra steps on average"}`)+"."});
 }
 r.onQuit=()=>{ if(i>0)done(); else {closeRunner();render();} };
 trial();
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   Sync — one private GitHub Gist holds the whole training log.
   No server to run, reachable from any browser, and the data
   stays a JSON document the user owns.

   Note: the Claude artifact view blocks outbound fetch by CSP,
   so this works in a hosted copy; inside the artifact the app
   keeps using its own cloud storage and says so plainly.
   ═══════════════════════════════════════════════════════════ */
const Sync=(()=>{
 const K="locilab.sync", DESC="loci-lab-data", FILE="loci-lab.json";
 const API="https://api.github.com";
 let cfg=null, state="off", note="", timer=null, inflight=false;

 function read(){ try{ return JSON.parse(localStorage.getItem(K)||"null"); }catch(e){ return null; } }
 function write(){ try{ localStorage.setItem(K,JSON.stringify(cfg)); }catch(e){} }
 function set(s,n){ state=s; note=n||""; paintChip(); }

 async function gh(path,opts){
  opts=opts||{};
  const h={"Accept":"application/vnd.github+json",
           "Authorization":"Bearer "+cfg.token,
           "X-GitHub-Api-Version":"2022-11-28"};
  if(opts.body)h["Content-Type"]="application/json";
  let r;
  try{ r=await fetch(API+path,{method:opts.method||"GET",headers:h,body:opts.body}); }
  catch(e){ const err=new Error("blocked"); err.blocked=true; throw err; }
  if(r.status===401)throw new Error("Token rejected — check it has Gists read and write");
  if(r.status===403)throw new Error("GitHub refused (rate limit or missing Gist permission)");
  if(!r.ok)throw new Error("GitHub returned "+r.status);
  return r.json();
 }

 function snapshot(){
  const D=Store.d;
  return {v:1, savedAt:new Date().toISOString(), profile:D.profile,
    sessions:D.sessions, cards:D.cards, sets:D.sets, passages:D.passages};
 }

 /* union by id, so a session recorded offline on the other device is never dropped */
 function mergeById(a,b,pick){
  const m=new Map();
  (a||[]).forEach(r=>{ if(r&&r.id)m.set(r.id,r); });
  (b||[]).forEach(r=>{
   if(!r||!r.id)return;
   const cur=m.get(r.id);
   m.set(r.id, cur&&pick ? pick(cur,r) : (cur||r));
  });
  return [...m.values()];
 }
 function merge(local,remote){
  if(!remote||typeof remote!=="object")return local;
  const out={};
  out.sessions=mergeById(local.sessions,remote.sessions);
  out.sets=mergeById(local.sets,remote.sets);
  out.passages=mergeById(local.passages,remote.passages);
  /* a card's truth is whichever side reviewed it later */
  out.cards=mergeById(local.cards,remote.cards,(x,y)=>
    String(y.due||"")>String(x.due||"") ? y : x);
  const lp=local.profile||{}, rp=remote.profile||{};
  const newer=String(rp.savedAt||"")>String(lp.savedAt||"") ? rp : lp;
  const df=defaultProfile();
  out.profile={...df,...newer,
    drills:Object.assign({},df.drills,newer.drills||{}),
    seen:Object.assign({},lp.seen||{},rp.seen||{}),
    streak:Math.max(lp.streak||0,rp.streak||0),
    lastDay:(String(rp.lastDay||"")>String(lp.lastDay||"")?rp.lastDay:lp.lastDay)||null};
  for(const k in df.drills)
    out.profile.drills[k]=Object.assign({},df.drills[k],out.profile.drills[k]);
  return out;
 }

 async function findGist(){
  const list=await gh("/gists?per_page=100");
  const hit=(list||[]).find(g=>g.description===DESC);
  return hit?hit.id:null;
 }
 async function createGist(){
  const g=await gh("/gists",{method:"POST",body:JSON.stringify({
    description:DESC, public:false,
    files:{[FILE]:{content:JSON.stringify(snapshot(),null,1)}}})});
  return g.id;
 }
 async function readGist(){
  const g=await gh("/gists/"+cfg.gistId);
  const f=g.files&&g.files[FILE];
  if(!f)return null;
  let text=f.content;
  if(f.truncated&&f.raw_url){ const r=await fetch(f.raw_url); text=await r.text(); }
  try{ return JSON.parse(text); }catch(e){ return null; }
 }

 async function pull(){
  if(!cfg||!cfg.gistId)return;
  set("sync","Pulling");
  const remote=await readGist();
  if(remote){
   const merged=merge(snapshot(),remote);
   const D=Store.d;
   D.sessions=merged.sessions; D.cards=merged.cards;
   D.sets=merged.sets; D.passages=merged.passages; D.profile=merged.profile;
   Store.persist();
  }
  cfg.lastPull=Date.now(); write();
  set("ok");
 }
 async function pushNow(){
  if(!cfg||!cfg.gistId||inflight)return;
  inflight=true; set("sync","Saving");
  try{
   await gh("/gists/"+cfg.gistId,{method:"PATCH",body:JSON.stringify({
     files:{[FILE]:{content:JSON.stringify(snapshot(),null,1)}}})});
   cfg.lastPush=Date.now(); write(); set("ok");
  }catch(e){ set("err",e.blocked?"Offline":e.message); }
  finally{ inflight=false; }
 }
 /* a twenty-trial session is one request, not twenty */
 function schedule(){
  if(!cfg||!cfg.gistId)return;
  clearTimeout(timer);
  timer=setTimeout(()=>pushNow(),3000);
 }

 async function connect(token){
  cfg={token:String(token||"").trim()};
  if(!cfg.token){ cfg=null; set("off"); throw new Error("Paste a token first"); }
  set("sync","Connecting");
  try{
   cfg.gistId=await findGist();
   if(!cfg.gistId)cfg.gistId=await createGist();
   write();
   await pull();
   await pushNow();
   return true;
  }catch(e){
   const blocked=e.blocked;
   cfg=null; try{localStorage.removeItem(K);}catch(x){}
   set("off");
   throw new Error(blocked
     ? "This copy cannot reach GitHub. The Claude artifact view blocks outside requests — use your hosted copy for Gist sync."
     : e.message);
  }
 }
 function disconnect(){
  cfg=null; clearTimeout(timer);
  try{ localStorage.removeItem(K); }catch(e){}
  set("off");
 }

 function paintChip(){
  const c=document.getElementById("syncChip");
  if(!c)return;
  const map={off:["",""],sync:["warn",note||"Syncing"],ok:["ok","Synced"],err:["bad",note||"Error"]};
  const [cls,label]=map[state]||["",""];
  if(state==="off"){ c.hidden=true; return; }
  c.hidden=false; c.className="pill "+cls; c.textContent=label;
 }
 function ago(t){
  if(!t)return "never";
  const s=Math.round((Date.now()-t)/1000);
  if(s<60)return "just now";
  if(s<3600)return Math.round(s/60)+"m ago";
  if(s<86400)return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
 }

 function init(){
  cfg=read();
  if(!cfg||!cfg.token||!cfg.gistId){ cfg=cfg&&cfg.token?cfg:null; set("off"); return; }
  set("sync","Syncing");
  pull().then(()=>{ render(); }).catch(e=>set("err",e.blocked?"Offline":e.message));
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden&&cfg&&cfg.gistId)pull().then(render).catch(()=>{});
  });
 }
 return {init,connect,disconnect,schedule,pushNow,pull,paintChip,
   get on(){return !!(cfg&&cfg.gistId);},
   get state(){return state;}, get note(){return note;},
   get lastPush(){return cfg&&cfg.lastPush;},
   ago, merge};
})();
</script>

 math:["Calculating without losing the picture","Problems come with a shelf of three places to park the numbers you are holding. Park them, say them out loud, and re-touch all three whenever the app pulses. If the picture degrades, tap Signal dropped so it gets counted."],

 pattern:["Building the library that does the work","A cue appears, you recall what it is, then grade yourself. Cards you find easy come back rarely, cards you miss come back tomorrow. Around 150 to 200 patterns in a domain, things start arriving already recognised."],
 verbatim:["Word for word, with the cues fading","The passage is cut into short phrases, one per locus. Each stage gives you less: the whole phrase, then first letters, then words dropped, then nothing. Clear 90 percent to move up."],
 grid:["Attention without eye movement","Fixate the centre and find the numbers in order using peripheral vision only. It trains where your attention goes, which is separate from where your eyes point."],
};
function presetMatches(p,cfg){ return Object.entries(p.vals).every(([k,v])=>
  Array.isArray(v)?JSON.stringify(cfg[k])===JSON.stringify(v):cfg[k]===v); }

function matChips(cur,kinds){
 return `<div class="chips" id="cSet">${allSets().filter(s=>!kinds||kinds.includes(s.kind))
  .map(s=>`<button data-v="${s.id}" aria-pressed="${s.id===cur}">${esc(s.name)}</button>`).join("")}</div>`;
}
function presetCards(k,cfg,hue){
 const list=(PRESETS[k]||[]).slice();
 const cont=continuePreset(k,cfg);
 if(cont)list.push(cont);
 const anyMatch=list.some(p=>presetMatches(p,cfg));
 return `<div class="presets" id="cPre">${list.map(p=>
  `<button class="preset" style="--hue:${hue}" data-p="${p.id}" aria-pressed="${presetMatches(p,cfg)}">
    <span class="pk">${PK[p.k]||PK.mid}</span>
    <span class="pt"><b>${esc(p.name)}</b><i>${esc(p.desc)}</i></span></button>`).join("")}
  ${anyMatch?"":`<div class="note" style="padding-left:2px">Currently on your own settings from Fine tuning.</div>`}
 </div>`;
}
function continuePreset(k,cfg){
 if(k==="flash"&&cfg.thr)return {id:"__cont",k:"cont",name:"Continue",
   desc:`Where you left off — ${cfg.load} items at ${cfg.exp}ms.`,vals:{load:cfg.load,exp:cfg.exp,trials:cfg.trials}};
 if(k==="span"&&cfg.best)return {id:"__cont",k:"cont",name:"Continue",
   desc:`Where you left off — starting at ${cfg.load} items.`,vals:{load:cfg.load,pace:cfg.pace,delay:cfg.delay,trials:cfg.trials}};
 return null;
}
function coachCard(k){
 const seen=(Store.d.profile.seen||{})[k];
 if(seen)return "";
 const c=COACH[k]; if(!c)return "";
 return `<div class="card coach reveal d1"><h3>${esc(c[0])}</h3>
   <div class="prose" style="font-size:13.5px"><p>${esc(c[1])}</p></div>
   <button class="btn sm" id="cSeen" style="margin-top:4px">Got it</button></div>`;
}

function screenDrill(k){
 const d=drillOf(k), c=Store.d.profile.drills[k];
 let material="",tuning="",extra="";
 if(k==="flash"){
   material=matChips(c.setId);
   tuning=`${slider("cLoad","How many items at once",c.load,1,20,1,"")}
     <div class="note">How much has to land in a single look.</div>
     ${slider("cExp","How long it stays on screen",c.exp,60,1200,20,"ms")}
     <div class="note">Below about 200ms your eyes cannot move, which is the zone that matters.</div>
     ${slider("cTrials","Rounds in a session",c.trials,5,60,5,"")}
     ${slider("cFix","Cross before each round",c.fix,300,2000,100,"ms")}
     ${segp("cMask","Scramble after",[{v:"1",t:"On"},{v:"0",t:"Off"}],c.mask?"1":"0")}
     <div class="note">The scramble stops you reading an afterimage. Leave it on.</div>
     ${segp("cAdapt","Let it find your level",[{v:"1",t:"On"},{v:"0",t:"Off"}],c.adapt?"1":"0")}
     <div class="note">Three right in a row shortens the flash, one wrong lengthens it. It settles on
     the speed you get about 79% right, which is the number worth tracking. Once that drops under
     150ms it adds an item instead.</div>`;
 } else if(k==="span"){
   material=matChips(c.setId);
   tuning=`${slider("cLoad","Items to start with",c.load,2,20,1,"")}
     ${segp("cMode","How they arrive",[{v:"serial",t:"One at a time"},{v:"sim",t:"All at once"}],c.mode)}
     ${slider("cPace","Time per item",c.pace,200,2500,100,"ms")}
     ${slider("cDelay","Empty pause before you answer",c.delay,0,20,1,"s")}
     <div class="note">The pause is where the work happens. Longer is harder.</div>
     ${slider("cTrials","Rounds in a session",c.trials,5,30,1,"")}
     ${segp("cAdapt","Climb automatically",[{v:"1",t:"On"},{v:"0",t:"Off"}],c.adapt?"1":"0")}
     <div class="note">Two clean runs adds an item, two misses takes one away.</div>`;
 } else if(k==="math"){
   tuning=`${slider("cDig","Size of the numbers",c.digits,1,4,1,"-digit")}
     ${slider("cSteps","Operations per problem",c.steps,1,5,1,"")}
     ${segp("cOps","Which operations",[{v:"+-",t:"+ and −"},{v:"+-x",t:"add ×"},{v:"+-x/",t:"add ÷"}],c.ops.join(""))}
     ${slider("cTrials","Problems in a session",c.trials,5,30,1,"")}
     ${segp("cScaf","Show the shelf",[{v:"1",t:"On"},{v:"0",t:"Off"}],c.scaffold?"1":"0")}
     ${slider("cBeat","Pulse every",c.beat,3,15,1,"s")}
     <div class="note">The pulse is your cue to re-touch every number on the shelf. Shorter is a
     stricter habit; six seconds is a reasonable place to start.</div>`;
 } else if(k==="balance"){
   tuning=`${segp("cTier","Difficulty",[{v:"1",t:"x + b = c"},{v:"2",t:"ax + b = c"},{v:"3",t:"x both sides"},{v:"4",t:"negatives"}],String(c.tier))}
     ${segp("cBMode","Mode",[{v:"guided",t:"Guided"},{v:"head",t:"Head first"}],c.mode)}
     ${segp("cSpeed","Animation speed",[{v:"0.5",t:"Slow"},{v:"1",t:"Normal"},{v:"2",t:"Fast"}],String(c.speed))}
     ${slider("cTrials","Equations in a session",c.trials,4,20,1,"")}
     <div class="note">Guided lets you choose every move. Head first makes you solve it silently,
     then replays the canonical route so you can compare it against the one you ran internally.</div>`;
 } else if(k==="grid"){
   tuning=`${segp("cMode","Mode",[{v:"schulte",t:"Schulte table"},{v:"flash",t:"Flash matrix"}],c.mode)}

 } else if(k==="verbatim"){

        <span>${esc(x)}</span></div>`).join("")}${ch.length>5?`<div class="note">+ ${ch.length-5} more</div>`:""}</div></div>`;
 }
 const hasPre=!!PRESETS[k];
 return `<div class="wrap"><div class="stack">
   ${backBtn("Train","train")}
   ${header(d.blurb,d.name,"")}

     <button class="btn pri wide" id="cStart">${ICON.play}<span>Start session</span></button>

 </div></div>`;
}

function wireDrill(k){
 const c=Store.d.profile.drills[k];

 const seen=document.getElementById("cSeen");
 if(seen)seen.onclick=()=>{ (Store.d.profile.seen=Store.d.profile.seen||{})[k]=1; save(); render(); };
 const pre=document.getElementById("cPre");
 if(pre)pre.onclick=e=>{
   const b=e.target.closest("[data-p]"); if(!b)return;

   Object.assign(c,p.vals); save(); render();
 };
 wireSeg("cSet",v=>{c.setId=v;save();});

 wireSlider("cLoad",v=>{c.load=v;save();},"");

 wireSlider("cFix",v=>{c.fix=v;save();},"ms");
 wireSlider("cTrials",v=>{c.trials=v;save();},"");
 wireSlider("cPace",v=>{c.pace=v;save();},"ms");
 wireSlider("cDelay",v=>{c.delay=v;save();},"s");
 wireSlider("cDig",v=>{c.digits=v;save();},"-digit");
 wireSlider("cSteps",v=>{c.steps=v;save();},"");
 wireSlider("cBeat",v=>{c.beat=v;save();},"s");

 const go=document.getElementById("syncGo");
 if(go)go.onclick=async()=>{

     go.disabled=false; go.textContent="Connect"; }

 if(now)now.onclick=async()=>{ now.textContent="Syncing\u2026";
   try{ await Sync.pull(); await Sync.pushNow(); }catch(e){}
   render(); };
 const off=document.getElementById("syncOff");
 if(off)off.onclick=()=>{
   if(!off.dataset.armed){ off.dataset.armed="1"; off.textContent="Sure?";

     return; }

/* ═══════════════════════════════════════════════════════════
   Charts. SVG for anything you read a value off, canvas for the
   one surface where rotation earns its place.
   ═══════════════════════════════════════════════════════════ */
const CH={
 ticks(min,max,n){
  if(!isFinite(min)||!isFinite(max))return [0,1];
  if(min===max){min-=1;max+=1;}
  const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)||0));
  const norm=raw/mag, step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(10));
  return out;
 },
 line(rows,hue,unit){
  if(rows.length<2)return "";
  const W=320,H=172,ml=40,mr=12,mt=12,mb=28;
  const ys=rows.map(r=>r.y);
  const tk=CH.ticks(Math.min(...ys),Math.max(...ys),4);
  const y0=tk[0],y1=tk[tk.length-1];
  const px=i=>ml+i*(W-ml-mr)/(rows.length-1);
  const py=v=>H-mb-((v-y0)/((y1-y0)||1))*(H-mt-mb);
  const pts=rows.map((r,i)=>`${px(i).toFixed(1)},${py(r.y).toFixed(1)}`).join(" ");
  const area=`M${ml},${H-mb} L`+pts.replace(/ /g," L")+` L${px(rows.length-1)},${H-mb} Z`;
  const last=rows[rows.length-1];
  const xl=[0,Math.floor((rows.length-1)/2),rows.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(unit)} over ${rows.length} sessions, latest ${fmtNum(last.y)}">
    <defs><linearGradient id="g${hue.slice(1)}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${hue}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${hue}" stop-opacity="0"/></linearGradient></defs>
    ${tk.map(t=>`<line class="grid" x1="${ml}" y1="${py(t)}" x2="${W-mr}" y2="${py(t)}"/>
      <text x="${ml-7}" y="${py(t)+3}" text-anchor="end">${fmtNum(t)}</text>`).join("")}
    <path d="${area}" fill="url(#g${hue.slice(1)})"/>
    <polyline points="${pts}" fill="none" stroke="${hue}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${rows.map((r,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(r.y).toFixed(1)}" r="2.6"
      fill="${hue}"><title>${esc(r.label)}: ${fmtNum(r.y)} ${esc(unit)}</title></circle>`).join("")}
    <circle cx="${px(rows.length-1)}" cy="${py(last.y)}" r="4.6" fill="${hue}"/>
    ${xl.map(i=>`<text x="${px(i)}" y="${H-9}" text-anchor="${i===0?"start":i===rows.length-1?"end":"middle"}">${esc(rows[i].label)}</text>`).join("")}
    <text class="axl" x="${ml}" y="${mt-2}">${esc(unit)}</text>
  </svg></div>`;
 },
 bars(items,hue,unit){
  if(!items.length)return "";
  const W=320,H=150,ml=34,mr=10,mt=14,mb=30;
  const max=Math.max(...items.map(d=>d.v))||1;
  const tk=CH.ticks(0,max,3), top=tk[tk.length-1];
  const bw=(W-ml-mr)/items.length;
  const py=v=>H-mb-(v/top)*(H-mt-mb);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} by group">
    ${tk.map(t=>`<line class="grid" x1="${ml}" y1="${py(t)}" x2="${W-mr}" y2="${py(t)}"/>
      <text x="${ml-7}" y="${py(t)+3}" text-anchor="end">${fmtNum(t)}</text>`).join("")}
    ${items.map((d,i)=>{const x=ml+i*bw+bw*.16,w=bw*.68,y=py(d.v);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}"
        height="${(H-mb-y).toFixed(1)}" rx="3" fill="${hue}" opacity="${.45+.55*(d.v/top)}">
        <title>${esc(d.label)}: ${fmtNum(d.v)} ${esc(unit)} (${d.n} trials)</title></rect>
        <text x="${(x+w/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle">${fmtNum(d.v)}</text>
        <text x="${(x+w/2).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(d.label)}</text>`;}).join("")}
    <text class="axl" x="${ml}" y="${mt-4}">${esc(unit)}</text>
  </svg></div>`;
 },
 strip(rows){
  if(!rows.length)return "";
  const W=320,H=130,ml=46,mr=12,mt=16,mb=26;
  const ms=rows.map(r=>r.ms);
  const tk=CH.ticks(0,Math.max(...ms),4), top=tk[tk.length-1];
  const px=v=>ml+(v/top)*(W-ml-mr);
  const jit=i=>(((i*37)%17)-8)*1.35;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="response times by outcome">
    ${tk.map(t=>`<line class="grid" x1="${px(t)}" y1="${mt}" x2="${px(t)}" y2="${H-mb}"/>
      <text x="${px(t)}" y="${H-10}" text-anchor="middle">${(t/1000).toFixed(1)}s</text>`).join("")}
    <text x="${ml-8}" y="${mt+22}" text-anchor="end">hit</text>
    <text x="${ml-8}" y="${H-mb-8}" text-anchor="end">miss</text>
    ${rows.map((r,i)=>`<circle cx="${px(Math.min(r.ms,top)).toFixed(1)}"
      cy="${(r.ok?mt+20:H-mb-14)+jit(i)}" r="2.6" fill="${r.ok?"var(--ok)":"var(--bad)"}"
      opacity=".62"><title>${(r.ms/1000).toFixed(1)}s ${r.ok?"correct":"miss"}</title></circle>`).join("")}
    <text class="axl" x="${ml}" y="${mt-5}">response time</text>
  </svg></div>`;
 },
 cal(map){
  const cell=13,gap=3,weeks=13,W=weeks*(cell+gap),H=7*(cell+gap)+16;
  const end=new Date(); end.setHours(0,0,0,0);
  const start=new Date(end); start.setDate(end.getDate()-(weeks*7-1));
  start.setDate(start.getDate()-start.getDay());
  const max=Math.max(1,...Object.values(map));
  let out="",mon="",labels="";
  for(let w=0;w<weeks;w++)for(let dd=0;dd<7;dd++){
    const d=new Date(start); d.setDate(start.getDate()+w*7+dd);
    if(d>end)continue;
    const key=d.toISOString().slice(0,10), n=map[key]||0;
    const t=n/max;
    const fill=n?`color-mix(in srgb, var(--brand-accent) ${Math.round(24+t*76)}%, var(--surface-2))`:"var(--surface-2)";
    out+=`<rect x="${w*(cell+gap)}" y="${16+dd*(cell+gap)}" width="${cell}" height="${cell}" rx="3"
      fill="${fill}" stroke="var(--hairline)"><title>${key}: ${n} trial${n===1?"":"s"}</title></rect>`;
    if(dd===0){ const m=d.toLocaleString(undefined,{month:"short"});
      if(m!==mon){mon=m;labels+=`<text x="${w*(cell+gap)}" y="10">${m}</text>`;} }
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="training calendar">
    ${labels}${out}</svg></div>`;
 }
};

/* ── 3D performance surface: accuracy over load × exposure ── */
function surface3d(canvas,grid){
 const dpr=Math.min(2,window.devicePixelRatio||1);
 let rot=-0.72, tilt=0.62, drag=null;
 const css=()=>getComputedStyle(document.documentElement);
 function lerp(a,b,t){return a+(b-a)*t;}
 function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
 function ramp(t){
  const a=hex("#A63F35"),b=hex("#D08B2C"),c=hex("#2E7D72");
  const [p,q,u]=t<.5?[a,b,t*2]:[b,c,(t-.5)*2];
  return `rgb(${Math.round(lerp(p[0],q[0],u))},${Math.round(lerp(p[1],q[1],u))},${Math.round(lerp(p[2],q[2],u))})`;
 }
 function proj(x,y,z,W,H){
  const c=Math.cos(rot),s=Math.sin(rot);
  const X=x*c-z*s, Z=x*s+z*c;
  const ct=Math.cos(tilt), st=Math.sin(tilt);
  const Y=y*ct-Z*st, D=y*st+Z*ct;
  const k=Math.min(W,H)*0.42;
  return {x:W/2+X*k, y:H/2-Y*k-H*0.07, d:D};
 }
 function draw(){
  const W=canvas.clientWidth, H=canvas.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const g=canvas.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const ink=css().getPropertyValue("--ink-3").trim()||"#888";
  const line=css().getPropertyValue("--hairline").trim()||"rgba(0,0,0,.1)";
  const nx=grid.loads.length, nz=grid.exps.length;
  const gx=i=>nx<2?0:(i/(nx-1))*2-1;
  const gz=j=>nz<2?0:(j/(nz-1))*2-1;
  const gy=v=>v==null?null:v*1.05-0.5;
  /* floor */
  g.strokeStyle=line; g.lineWidth=1;
  for(let i=0;i<nx;i++){ const a=proj(gx(i),-0.55,-1,W,H), b=proj(gx(i),-0.55,1,W,H);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke(); }
  for(let j=0;j<nz;j++){ const a=proj(-1,-0.55,gz(j),W,H), b=proj(1,-0.55,gz(j),W,H);
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke(); }
  /* quads, far first */
  const quads=[];
  for(let i=0;i<nx-1;i++)for(let j=0;j<nz-1;j++){
    const v=[grid.at(i,j),grid.at(i+1,j),grid.at(i+1,j+1),grid.at(i,j+1)];
    if(v.some(x=>x==null))continue;
    const p=[proj(gx(i),gy(v[0]),gz(j),W,H),proj(gx(i+1),gy(v[1]),gz(j),W,H),
             proj(gx(i+1),gy(v[2]),gz(j+1),W,H),proj(gx(i),gy(v[3]),gz(j+1),W,H)];
    quads.push({p,t:(v[0]+v[1]+v[2]+v[3])/4,d:(p[0].d+p[1].d+p[2].d+p[3].d)/4});
  }
  quads.sort((a,b)=>b.d-a.d);
  quads.forEach(q=>{
    g.beginPath(); g.moveTo(q.p[0].x,q.p[0].y);
    for(let k=1;k<4;k++)g.lineTo(q.p[k].x,q.p[k].y);
    g.closePath(); g.fillStyle=ramp(q.t); g.fill();
    g.strokeStyle="rgba(0,0,0,.22)"; g.lineWidth=.8; g.stroke();
  });
  /* pillars where a cell has data but no neighbours to form a quad */
  if(!quads.length){
    for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){
      const v=grid.at(i,j); if(v==null)continue;
      const b=proj(gx(i),-0.55,gz(j),W,H), t=proj(gx(i),gy(v),gz(j),W,H);
      g.strokeStyle=ramp(v); g.lineWidth=7; g.lineCap="round";
      g.beginPath();g.moveTo(b.x,b.y);g.lineTo(t.x,t.y);g.stroke();
    }
    g.lineWidth=1;
  }
  /* axes */
  g.fillStyle=ink; g.font="10px ui-monospace,monospace";
  g.textAlign="center"; g.textBaseline="middle";
  const put=(t,q)=>g.fillText(t,clamp(q.x,44,W-44),clamp(q.y,12,H-10));
  put("load "+grid.loads[0]+"–"+grid.loads[nx-1],proj(1.22,-0.58,0,W,H));
  put(grid.expLabel,proj(0,-0.58,1.26,W,H));
  put("accuracy",proj(-1.2,0.68,-1,W,H));
 }
 canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,r:rot,y:e.clientY,t:tilt};
   canvas.setPointerCapture(e.pointerId);});
 canvas.addEventListener("pointermove",e=>{ if(!drag)return;
   rot=drag.r+(e.clientX-drag.x)*0.011;
   tilt=clamp(drag.t+(e.clientY-drag.y)*0.006,0.12,1.35); draw(); });
 const end=()=>drag=null;
 canvas.addEventListener("pointerup",end); canvas.addEventListener("pointercancel",end);
 window.addEventListener("resize",draw);
 requestAnimationFrame(draw);
 return draw;
}
function buildGrid(rows){
 const loads=[...new Set(rows.map(r=>r.load))].sort((a,b)=>a-b);
 const B=[80,120,180,260,380,550,800,1200];
 const bucket=e=>{ for(const b of B) if(e<=b) return b; return 1200; };
 const exps=[...new Set(rows.map(r=>bucket(r.exp)))].sort((a,b)=>a-b);
 const acc={},cnt={};
 rows.forEach(r=>{ const k=r.load+"|"+bucket(r.exp);
   acc[k]=(acc[k]||0)+(r.ok?1:0); cnt[k]=(cnt[k]||0)+1; });
 return {loads,exps,expLabel:"exposure "+exps[0]+"–"+exps[exps.length-1]+"ms",
  at(i,j){ const k=loads[i]+"|"+exps[j]; return cnt[k]>=2?acc[k]/cnt[k]:null; },
  cells:Object.keys(cnt).length};
}
